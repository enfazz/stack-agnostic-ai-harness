# AI harness · @claude responder (GitHub Actions)
# Responds when someone writes "@claude ..." in an issue or PR comment.
#
# AUTH — pick ONE (the harness works with either):
#   • Claude subscription (Pro/Max/Team): run `claude setup-token` locally once,
#     then add the output as the repo secret CLAUDE_CODE_OAUTH_TOKEN.  ← default below
#   • Anthropic API billing: add the repo secret ANTHROPIC_API_KEY instead
#     (swap the commented line below).
# Also install the Claude GitHub App once: https://github.com/apps/claude
# (or run `/install-github-app` inside Claude Code).
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [assigned]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude') || contains(github.event.issue.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          # Subscription auth (default) — generated by `claude setup-token`:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # API auth (alternative) — comment the line above and uncomment this:
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Load this harness so CI Claude has the same skills/agents/hooks:
          plugin_marketplaces: |
            https://github.com/enfazz/stack-agnostic-ai-harness
          plugins: |
            ai-harness@ai-harness
          claude_args: |
            --max-turns 15
